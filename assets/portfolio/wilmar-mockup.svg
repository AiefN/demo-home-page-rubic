<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Mockup Proyek Wilmar - Website Korporat dan Hubungan Investor Tbk">
  <defs>
    <linearGradient id="wilmarAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect x="0" y="0" width="800" height="480" rx="14" fill="#0B0B0C" stroke="#27272A" stroke-width="2" />
  <rect x="0" y="0" width="800" height="42" rx="14" fill="#18181B" />
  <rect x="0" y="28" width="800" height="14" fill="#18181B" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" />
  <circle cx="44" cy="21" r="6" fill="#F59E0B" />
  <circle cx="64" cy="21" r="6" fill="#10B981" />

  <!-- URL Bar -->
  <rect x="100" y="10" width="400" height="22" rx="6" fill="#27272A" />
  <text x="115" y="25" font-family="monospace" font-size="11" fill="#A1A1AA">https://wilmar.co.id/investor-relations/governance</text>

  <!-- Status Tag -->
  <rect x="580" y="10" width="200" height="22" rx="6" fill="#27272A" />
  <text x="595" y="25" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFB800">CORPORATE &amp; TBK PORTAL</text>

  <!-- Corporate Content Area -->
  <g transform="translate(30, 60)">
    <!-- Corporate Header -->
    <text x="0" y="28" font-family="sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="1">WILMAR <tspan fill="#A1A1AA" font-weight="400">GROUP</tspan></text>
    <text x="210" y="26" font-family="sans-serif" font-size="11" fill="#A1A1AA">Tentang Kami</text>
    <text x="310" y="26" font-family="sans-serif" font-size="11" fill="#A1A1AA">Lini Usaha</text>
    <text x="390" y="26" font-family="sans-serif" font-size="11" fill="#FFB800" font-weight="600">Hubungan Investor</text>
    <text x="520" y="26" font-family="sans-serif" font-size="11" fill="#A1A1AA">Keberlanjutan (ESG)</text>

    <!-- Language Selector -->
    <rect x="660" y="12" width="70" height="22" rx="4" fill="#27272A" />
    <text x="675" y="27" font-family="sans-serif" font-size="11" fill="#FFFFFF">ID | EN</text>

    <!-- Investor Relations Highlight Banner -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="730" height="110" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <text x="25" y="35" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Tata Kelola Korporat &amp; Transparansi Pemegang Saham</text>
      <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#A1A1AA">Memberikan akses komprehensif terhadap keterbukaan informasi, laporan keuangan teraudit, dan prospektus.</text>
      <line x1="25" y1="75" x2="705" y2="75" stroke="#27272A" />
      <text x="25" y="95" font-family="sans-serif" font-size="11" fill="#FFB800">Kode Saham IDX: [WLMR]  |  Kapitalisasi Pasar: Komprehensif  |  Peringkat ESG: Baik</text>
    </g>

    <!-- Reports Table Mockup -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="730" height="200" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <text x="25" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Publikasi Laporan &amp; Pengumuman RUPS Terkini</text>
      
      <!-- Table Header -->
      <rect x="25" y="45" width="680" height="30" fill="#27272A" rx="4" />
      <text x="40" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">JUDUL LAPORAN RESMI</text>
      <text x="380" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">PERIODE</text>
      <text x="500" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">FORMAT</text>
      <text x="600" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">AKSI</text>

      <!-- Row 1 -->
      <text x="40" y="102" font-family="sans-serif" font-size="11" fill="#FFFFFF">Laporan Keberlanjutan (Sustainability Report)</text>
      <text x="380" y="102" font-family="sans-serif" font-size="11" fill="#A1A1AA">FY 2025</text>
      <text x="500" y="102" font-family="sans-serif" font-size="11" fill="#A1A1AA">PDF (12.4 MB)</text>
      <text x="600" y="102" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFB800">Unduh ↓</text>
      <line x1="25" y1="115" x2="705" y2="115" stroke="#27272A" />

      <!-- Row 2 -->
      <text x="40" y="140" font-family="sans-serif" font-size="11" fill="#FFFFFF">Laporan Keuangan Konsolidasian Teraudit</text>
      <text x="380" y="140" font-family="sans-serif" font-size="11" fill="#A1A1AA">Q4 / Tahunan</text>
      <text x="500" y="140" font-family="sans-serif" font-size="11" fill="#A1A1AA">PDF (8.1 MB)</text>
      <text x="600" y="140" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFB800">Unduh ↓</text>
      <line x1="25" y1="155" x2="705" y2="155" stroke="#27272A" />

      <!-- Row 3 -->
      <text x="40" y="178" font-family="sans-serif" font-size="11" fill="#FFFFFF">Ringkasan Risalah Rapat Umum Pemegang Saham (RUPS)</text>
      <text x="380" y="178" font-family="sans-serif" font-size="11" fill="#A1A1AA">Terbaru</text>
      <text x="500" y="178" font-family="sans-serif" font-size="11" fill="#A1A1AA">PDF (2.3 MB)</text>
      <text x="600" y="178" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFB800">Unduh ↓</text>
    </g>
  </g>
</svg>

