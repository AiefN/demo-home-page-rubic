<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Mockup Proyek Karalia - Platform E-Commerce dan Toko Online">
  <defs>
    <linearGradient id="karaliaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <rect x="0" y="0" width="800" height="480" rx="14" fill="#0B0B0C" stroke="#27272A" stroke-width="2" />
  <rect x="0" y="0" width="800" height="42" rx="14" fill="#18181B" />
  <rect x="0" y="28" width="800" height="14" fill="#18181B" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" />
  <circle cx="44" cy="21" r="6" fill="#F59E0B" />
  <circle cx="64" cy="21" r="6" fill="#10B981" />

  <!-- URL Bar -->
  <rect x="100" y="10" width="400" height="22" rx="6" fill="#27272A" />
  <text x="115" y="25" font-family="monospace" font-size="11" fill="#A1A1AA">https://karalia.store/collection/minimalist</text>

  <!-- Status Tag -->
  <rect x="610" y="10" width="170" height="22" rx="6" fill="#27272A" />
  <text x="625" y="25" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFB800">E-COMMERCE STORE</text>

  <!-- Storefront Content Area -->
  <g transform="translate(30, 60)">
    <!-- Store Header -->
    <text x="0" y="28" font-family="'Times New Roman', serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="2">KARALIA</text>
    <text x="140" y="26" font-family="sans-serif" font-size="11" fill="#A1A1AA">Wanita</text>
    <text x="200" y="26" font-family="sans-serif" font-size="11" fill="#A1A1AA">Pria</text>
    <text x="250" y="26" font-family="sans-serif" font-size="11" fill="#A1A1AA">Aksesoris</text>
    <text x="330" y="26" font-family="sans-serif" font-size="11" fill="#FFB800" font-weight="600">Diskon 40%</text>

    <!-- Cart Info -->
    <rect x="620" y="8" width="110" height="26" rx="6" fill="#27272A" />
    <text x="635" y="25" font-family="sans-serif" font-size="11" fill="#FFFFFF">Keranjang (3)</text>

    <!-- Hero Promotional Banner -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="730" height="120" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Koleksi Urban Minimalis 2026</text>
      <text x="30" y="70" font-family="sans-serif" font-size="12" fill="#A1A1AA">Didesain dengan bahan ramah lingkungan, presisi tinggi, dan kenyamanan tanpa kompromi.</text>
      <rect x="30" y="85" width="130" height="24" rx="4" fill="url(#karaliaGrad)" />
      <text x="45" y="101" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B0B0C">Jelajahi Katalog</text>
    </g>

    <!-- Product Grid (3 cards) -->
    <g transform="translate(0, 185)">
      <!-- Product 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="230" height="190" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
        <rect x="15" y="15" width="200" height="100" rx="6" fill="#27272A" />
        <text x="115" y="70" font-family="sans-serif" font-size="11" fill="#71717A" text-anchor="middle">[Foto Produk Premium]</text>
        <text x="15" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Atelier Linen Shirt</text>
        <text x="15" y="155" font-family="sans-serif" font-size="11" fill="#A1A1AA">Warna Off-White</text>
        <text x="15" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFB800">Rp 489.000</text>
      </g>

      <!-- Product 2 -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="230" height="190" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
        <rect x="15" y="15" width="200" height="100" rx="6" fill="#27272A" />
        <text x="115" y="70" font-family="sans-serif" font-size="11" fill="#71717A" text-anchor="middle">[Foto Produk Premium]</text>
        <text x="15" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Nordic Chrono Watch</text>
        <text x="15" y="155" font-family="sans-serif" font-size="11" fill="#A1A1AA">Stainless Steel Case</text>
        <text x="15" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFB800">Rp 1.250.000</text>
      </g>

      <!-- Product 3 -->
      <g transform="translate(500, 0)">
        <rect x="0" y="0" width="230" height="190" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
        <rect x="15" y="15" width="200" height="100" rx="6" fill="#27272A" />
        <text x="115" y="70" font-family="sans-serif" font-size="11" fill="#71717A" text-anchor="middle">[Foto Produk Premium]</text>
        <text x="15" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Urban Leather Backpack</text>
        <text x="15" y="155" font-family="sans-serif" font-size="11" fill="#A1A1AA">Kapasitas 20 Liter</text>
        <text x="15" y="175" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFB800">Rp 899.000</text>
      </g>
    </g>
  </g>
</svg>

