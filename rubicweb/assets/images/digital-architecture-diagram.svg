<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Diagram Arsitektur Rekayasa Digital Rubicweb">
  <defs>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="320" rx="12" fill="#0B0B0C" stroke="#27272A" stroke-width="2" />
  
  <text x="30" y="45" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">RUBICWEB DIGITAL ARCHITECTURE FRAMEWORK</text>
  <text x="30" y="70" font-family="sans-serif" font-size="12" fill="#A1A1AA">Struktur fondasi rekayasa tiga pilar: Semantik, Performa Berkecepatan Tinggi, dan Dampak Bisnis.</text>
  <line x1="30" y1="88" x2="770" y2="88" stroke="#27272A" />

  <!-- Layer 1: Semantic Layer -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="230" height="175" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
    <rect x="15" y="15" width="200" height="28" rx="4" fill="#27272A" />
    <text x="115" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFB800" text-anchor="middle">01. SEMANTIC FOUNDATION</text>
    <text x="15" y="68" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">W3C HTML5 &amp; WCAG AA</text>
    <text x="15" y="90" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Hierarki heading terstruktur</text>
    <text x="15" y="110" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Markup Schema.org terindeks</text>
    <text x="15" y="130" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Aksesibilitas universal</text>
    <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Arsitektur informasi bersih</text>
  </g>

  <!-- Layer 2: Performance Core -->
  <g transform="translate(285, 110)">
    <rect x="0" y="0" width="230" height="175" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
    <rect x="15" y="15" width="200" height="28" rx="4" fill="#27272A" />
    <text x="115" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFB800" text-anchor="middle">02. PERFORMANCE ENGINE</text>
    <text x="15" y="68" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Core Web Vitals Optimal</text>
    <text x="15" y="90" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Sub-detik initial load</text>
    <text x="15" y="110" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Mereduksi beban transfer data</text>
    <text x="15" y="130" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Zero bloatware dependency</text>
    <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Caching &amp; aset kompresi tinggi</text>
  </g>

  <!-- Layer 3: Business Impact -->
  <g transform="translate(540, 110)">
    <rect x="0" y="0" width="230" height="175" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
    <rect x="15" y="15" width="200" height="28" rx="4" fill="#27272A" />
    <text x="115" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFB800" text-anchor="middle">03. BUSINESS IMPACT</text>
    <text x="15" y="68" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Skalabilitas &amp; Konversi</text>
    <text x="15" y="90" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Peringkat #1 Google SEO</text>
    <text x="15" y="110" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Konversi transaksi tinggi</text>
    <text x="15" y="130" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Kredibilitas merek teruji</text>
    <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#A1A1AA">&bull; Siap scale-up tanpa batas</text>
  </g>
</svg>
